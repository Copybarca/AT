[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trans-flow"
version = "0.1.0"
description = "Local LLM translation workflows and agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "httpx",
    "ollama",
    "pydantic-settings",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trans_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
