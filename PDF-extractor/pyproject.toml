[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-extractor"
version = "0.1.0"
description = "Backend API for text and OCR extraction from PDF documents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "ocrmypdf",
    "pdf2image",
    "pdfplumber",
    "pillow",
    "pydantic-settings",
    "pymupdf",
    "pypdf",
    "python-multipart",
    "pytesseract",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using .*starlette.testclient.* is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
