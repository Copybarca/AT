spring:
  application:
    name: trans-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/data}
    username: ${DB_USER:data}
    password: ${DB_PASSWORD:data}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: trans
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

storage:
  s3:
    bucket: ${S3_BUCKET:trans-books}
    prefix: ${S3_PREFIX:books}
    region: ${S3_REGION:us-east-1}
    endpoint: ${S3_ENDPOINT:}
    path-style-access: ${S3_PATH_STYLE_ACCESS:false}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}

clients:
  pdf-extractor:
    base-url: ${PDF_EXTRACTOR_BASE_URL:http://localhost:8001}
    extract-path: ${PDF_EXTRACTOR_PATH:/api/v1/extract}
  pdf-builder:
    base-url: ${PDF_BUILDER_BASE_URL:http://localhost:8002}
    build-path: ${PDF_BUILDER_PATH:/api/v1/books/build}
  agent-flow:
    base-url: ${AGENT_FLOW_BASE_URL:http://localhost:8003}
    translate-path: ${AGENT_FLOW_PATH:/api/v1/translate}

management:
  endpoints:
    web:
      exposure:
        include: health,info
